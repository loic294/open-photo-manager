[workspace]
members = ["crates/apm-core", "crates/apm-server"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.94"
version = "0.1.0"

# One dependency per line, alphabetical. Crates use `name.workspace = true`.
[workspace.dependencies]
anyhow = "1.0.104"
apm-core = { path = "crates/apm-core" }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
fast_image_resize = "6.1.0"
futures-util = "0.3.34"
globset = "0.4.21"
hex = "0.4.3"
http = "1.5.0"
http-body-util = "0.1.5"
httpdate = "1.0.3"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
mime = "0.3.18"
mime_guess = "2.0.5"
notify = "8.2.1"
proptest = "1.12.0"
quick-xml = "0.42.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "sqlite", "tls-rustls"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "fs", "limit", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
unicode-normalization = "0.1.26"
url = "2.5.8"
walkdir = "2.5.0"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = true
