name: Publish private image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - '.github/workflows/publish-image.yml'
      - '.dockerignore'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'web/**'
      - 'docker/Dockerfile'
      - 'docker/entrypoint.sh'
      - 'docker/healthcheck.sh'
      - 'docker/smoke.sh'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/loic294/advanced-photo-manager

jobs:
  prepare:
    if: github.repository == 'loic294/advanced-photo-manager'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Require private repository and package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/loic294/advanced-photo-manager --jq .private)" = true
          status="$(curl --silent --show-error --output package.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/users/loic294/packages/container/advanced-photo-manager)"
          case "$status" in
            200) jq -e '.visibility == "private"' package.json ;;
            404) echo 'First publication: GHCR creates a private package by default.' ;;
            *) echo "Cannot verify package visibility (HTTP $status)" >&2; exit 1 ;;
          esac
      - name: Select tags
        id: tags
        env:
          REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/heads/main ]]; then
            tags="$IMAGE:edge"
          elif [[ "$REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            version="${REF#refs/tags/v}"
            tags="$IMAGE:$version,$IMAGE:${version%.*},$IMAGE:latest"
          else
            echo "Publish only main or an exact vX.Y.Z release tag: $REF" >&2
            exit 1
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/loic294/advanced-photo-manager
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Smoke-test published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform "linux/$ARCH" "$IMAGE@$DIGEST"
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE@$DIGEST")" = "$ARCH"
          SMOKE_SKIP_BUILD=1 SMOKE_IMAGE="$IMAGE@$DIGEST" bash docker/smoke.sh
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1
          if-no-files-found: error

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Assemble and verify manifest
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api users/loic294/packages/container/advanced-photo-manager --jq .visibility)" = private
          amd64="$(cat digests/amd64)"
          arm64="$(cat digests/arm64)"
          [[ "$amd64" =~ ^sha256:[a-f0-9]{64}$ && "$arm64" =~ ^sha256:[a-f0-9]{64}$ ]]
          args=()
          IFS=',' read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$amd64" "$IMAGE@$arm64"
          for tag in "${tags[@]}"; do
            docker buildx imagetools inspect "$tag" --raw > manifest.json
            jq -e --arg amd64 "$amd64" --arg arm64 "$arm64" '
              (.manifests | length == 2) and
              ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64" and .digest == $amd64)] | length == 1) and
              ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64" and .digest == $arm64)] | length == 1)
            ' manifest.json
          done
